{% extends 'pool_service/base.html' %}

{% block title %}Разблокировка{% endblock %}

{% block content %}
<section class="min-vh-100 d-flex align-items-center justify-content-center py-4">
  <div class="card card-soft w-100" style="max-width: 420px;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary mb-3" style="width: 64px; height: 64px;">
          <i class="bi bi-shield-lock fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-2">Экран заблокирован</h1>
        <p class="text-muted mb-0">{{ user_full_name }}</p>
      </div>

      <form method="post" class="d-grid gap-3">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <div>
          <label class="form-label text-muted small" for="{{ form.pin.id_for_label }}">PIN-код</label>
          {{ form.pin }}
          {% if form.pin.errors %}
            <div class="text-danger small mt-2">{{ form.pin.errors|striptags }}</div>
          {% endif %}
        </div>
        <button type="submit" class="btn btn-primary btn-lg rounded-3">Продолжить</button>
      </form>

      <form method="post" action="{% url 'logout' %}" class="mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-link text-muted w-100 text-decoration-none" data-no-loading>
          Выйти и войти другим пользователем
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
