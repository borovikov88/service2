{% extends "pool_service/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-9">
    <div class="card card-body">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-shield-lock fs-3"></i>
        <h1 class="h3 mb-0">{{ title }}</h1>
      </div>
      <div class="alert alert-warning">
        <strong>Скопируйте данные сейчас.</strong> {{ instructions }}
      </div>

      <div class="mb-3">
        <label class="form-label">{{ secret_label }}</label>
        <div class="input-group">
          <input id="communication-secret" class="form-control font-monospace" value="{{ secret_value }}" readonly>
          <button class="btn btn-outline-secondary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('communication-secret').value)">Копировать</button>
        </div>
      </div>

      {% if callback_url %}
      <div class="mb-3">
        <label class="form-label">Webhook URL</label>
        <div class="input-group">
          <input id="communication-callback" class="form-control font-monospace" value="{{ callback_url }}" readonly>
          <button class="btn btn-outline-secondary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('communication-callback').value)">Копировать</button>
        </div>
      </div>
      {% endif %}

      {% if endpoint %}
      <div class="mb-3">
        <label class="form-label">Endpoint входящих сообщений</label>
        <input class="form-control font-monospace" value="{{ endpoint }}" readonly>
      </div>
      {% endif %}

      <div class="d-flex gap-2">
        <a class="btn btn-primary" href="{% url 'communications_channels' %}">Готово</a>
        <a class="btn btn-outline-secondary" href="{% url 'communication_connection_edit' connection.pk %}">Настройки подключения</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
