<style>
  .communications-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    margin-bottom:1rem;
  }
  .communications-tabs{
    display:inline-flex;
    align-items:center;
    gap:.25rem;
    padding:.25rem;
    border:1px solid var(--bs-border-color);
    border-radius:999px;
    background:var(--bs-tertiary-bg);
  }
  .communications-tab{
    display:inline-flex;
    align-items:center;
    gap:.45rem;
    min-height:38px;
    padding:.45rem .9rem;
    border-radius:999px;
    color:var(--bs-body-color);
    text-decoration:none;
    font-weight:600;
    transition:background-color .15s ease,color .15s ease,box-shadow .15s ease;
  }
  .communications-tab:hover{
    background:var(--bs-secondary-bg);
    color:var(--bs-body-color);
  }
  .communications-tab.is-active{
    background:var(--bs-primary);
    color:var(--bs-white);
    box-shadow:0 .125rem .4rem rgba(0,0,0,.12);
  }
  .communications-settings{
    width:42px;
    height:42px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid var(--bs-border-color);
    background:var(--bs-body-bg);
    color:var(--bs-body-color);
    text-decoration:none;
    font-size:1.1rem;
    flex:0 0 auto;
  }
  .communications-settings:hover{
    background:var(--bs-tertiary-bg);
    color:var(--bs-primary);
  }
  @media (max-width:575.98px){
    .communications-toolbar{align-items:flex-start}
    .communications-tab{padding:.45rem .72rem}
    .communications-tab span{display:none}
  }
</style>
<div class="communications-toolbar">
  <div>
    <h1 class="h3 mb-2">Коммуникации</h1>
    <nav class="communications-tabs" aria-label="Разделы коммуникаций">
      <a
        class="communications-tab {% if request.resolver_match.url_name == 'communications_conversations' %}is-active{% endif %}"
        href="{% url 'communications_conversations' %}"
        {% if request.resolver_match.url_name == 'communications_conversations' %}aria-current="page"{% endif %}
      >
        <i class="bi bi-chat-dots"></i><span>Диалоги</span>
      </a>
      <a
        class="communications-tab {% if request.resolver_match.url_name == 'communications_calls' %}is-active{% endif %}"
        href="{% url 'communications_calls' %}"
        {% if request.resolver_match.url_name == 'communications_calls' %}aria-current="page"{% endif %}
      >
        <i class="bi bi-telephone"></i><span>Звонки</span>
      </a>
      {% if can_access_manual_recordings %}
      <a
        class="communications-tab {% if request.resolver_match.url_name == 'communication_manual_recordings' %}is-active{% endif %}"
        href="{% url 'communication_manual_recordings' %}"
        {% if request.resolver_match.url_name == 'communication_manual_recordings' %}aria-current="page"{% endif %}
      >
        <i class="bi bi-file-earmark-music"></i><span>Файлы</span>
      </a>
      {% endif %}
    </nav>
  </div>
  {% if can_manage_communication_channels %}
    <a
      class="communications-settings"
      href="{% url 'communications_channels' %}"
      aria-label="Каналы связи"
      title="Каналы связи"
    >
      <i class="bi bi-gear"></i>
    </a>
  {% endif %}
</div>
