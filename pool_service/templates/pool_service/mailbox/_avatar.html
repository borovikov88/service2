{% load static %}<span class="mail-avatar mail-color-{{ letter.avatar_color }}{% if letter.avatar_brand %} mail-avatar-brand{% endif %}" aria-hidden="true">{% if letter.avatar_brand == "avito" %}<svg viewBox="0 0 32 32" focusable="false"><use href="#mail-avatar-avito"></use></svg>{% elif letter.avatar_brand %}{% with asset="assets/images/mail/"|add:letter.avatar_brand|add:".png" %}<img src="{% static asset %}" alt="">{% endwith %}{% else %}{{ letter.initials }}{% endif %}</span>
