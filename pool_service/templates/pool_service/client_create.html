{% extends 'pool_service/base.html' %}
{% load static %}
{% block title %}Контакт или компания · {{ brand_name }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'pool_service/customer_editor.css' %}?v=20261115-unified">
<script src="{% static 'pool_service/customer_editor.js' %}?v=20261115-unified" defer></script>
<script src="{% static 'pool_service/contact_creation.js' %}?v=20261115-unified" defer></script>
{% endblock %}
{% block content %}
<div hidden>{% csrf_token %}</div>
<div id="contact-create-root" class="contact-create-shell"></div>
{{ contact_create_bootstrap|json_script:'contact-create-bootstrap' }}
<noscript><div class="contact-create-shell"><h1>Создание контакта или компании</h1><p>Для работы с формой включите JavaScript.</p><a href="{{ return_url }}">Вернуться в справочник</a></div></noscript>
{% endblock %}
