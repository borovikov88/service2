{{ estimate_document_defaults|json_script:"pe-document-defaults" }}
<dialog id="pe-documents-dialog" class="pe-dialog pe-documents-dialog" aria-labelledby="pe-documents-title" data-can-manage="{{ estimate_document_can_manage|yesno:'true,false' }}">
 <form id="pe-documents-form">
  <div class="pe-dialog-header"><h2 id="pe-documents-title">Документы для клиента</h2><button type="button" class="pe-link" data-close="pe-documents-dialog" aria-label="Закрыть документы">✕</button></div>
  <p>Выберите комплектации. Смета и презентация оборудования формируются отдельно.</p>
  <fieldset class="pe-document-choices"><legend>Варианты для клиента</legend><label><input type="checkbox" name="variants" value="economy"> Эконом</label><label><input type="checkbox" name="variants" value="standard"> Стандарт</label><label><input type="checkbox" name="variants" value="premium"> Премиум</label></fieldset>
  <fieldset class="pe-document-choices"><legend>Документы</legend><label><input type="checkbox" name="types" value="estimate"> Смета</label><label><input type="checkbox" name="types" value="equipment"> Сравнение и описание оборудования</label></fieldset>
  <div class="pe-grid2"><label>Клиент<input name="client_name" maxlength="200" required autocomplete="organization"></label><label>Адрес объекта<input name="object_address" maxlength="500" required autocomplete="off"></label><label>Адрес клиента (если отличается)<input name="client_address" maxlength="500" autocomplete="off"></label><label>Номер предложения<input name="proposal_number" maxlength="80" placeholder="Автоматически, если не указан"></label><label>Дата предложения<input name="proposal_date" type="date" required></label></div>
  <details><summary>Гарантии и коммерческие условия</summary>
   <div class="pe-grid2"><label>Гарантия на оборудование<textarea name="equipment_warranty" maxlength="2000" rows="3" required placeholder="Утверждённые условия и срок"></textarea></label><label>Гарантия на работы<textarea name="installation_warranty" maxlength="2000" rows="3" required placeholder="Отдельно от гарантии производителя"></textarea></label><label>Сроки поставки и работ<textarea name="delivery_terms" maxlength="2000" rows="2"></textarea></label><label>Порядок оплаты<textarea name="payment_terms" maxlength="2000" rows="2"></textarea></label><label>Срок действия предложения<textarea name="validity" maxlength="2000" rows="2"></textarea></label><label>Менеджер и контакты<textarea name="manager" maxlength="2000" rows="2"></textarea></label><label>Входит в стоимость<textarea name="included" maxlength="2000" rows="3"></textarea></label><label>Оплачивается отдельно / выполняет заказчик<textarea name="not_included" maxlength="2000" rows="3"></textarea></label><label>Дополнительные условия<textarea name="conditions" maxlength="2000" rows="3"></textarea></label></div>
   {% if estimate_document_can_manage %}<button type="button" class="pe-btn" id="pe-document-defaults-save">Сохранить эти условия для новых предложений</button>{% endif %}
  </details>
  <label class="pe-document-review"><input type="checkbox" name="technical_reviewed" required> Проверил комплектацию и технические замечания. Клиентские документы не содержат внутренних подсказок.</label>
  <div id="pe-document-errors" class="pe-error" role="alert"></div><div id="pe-document-links" aria-live="polite"></div>
  <div class="pe-dialog-actions"><button type="submit" class="pe-btn pe-primary">Сохранить версию и подготовить документы</button><button type="button" class="pe-btn" data-close="pe-documents-dialog">Закрыть</button></div>
 </form>
</dialog>
