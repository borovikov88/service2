<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Запросы в 1С{% endblock %} · Ровик</title>
  <style>
    :root {color-scheme: light dark} body {font: 1rem/1.55 system-ui,sans-serif;max-width:58rem;margin:3rem auto;padding:0 1rem}
    button {cursor:pointer;padding:.55rem 1rem;margin:0 .5rem .5rem 0;font:inherit}
    textarea {width:100%;max-width:38rem;font:1rem/1.5 monospace;padding:.5rem;box-sizing:border-box}
    table {border-collapse:collapse} th,td {padding:.4rem .8rem;border-bottom:1px solid #8886;text-align:left}
    .scroll {overflow-x:auto} dd {margin-bottom:.5rem;overflow-wrap:anywhere} h1 {line-height:1.2} a {text-underline-offset:.2em}
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
