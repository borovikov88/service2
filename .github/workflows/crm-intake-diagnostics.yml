name: Read CRM intake runtime diagnostics

on:
  workflow_dispatch:
    inputs:
      confirm_main_sha:
        description: Exact current main SHA for read-only organization 1 aggregates
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: service2-crm-intake-diagnostics
  cancel-in-progress: false

jobs:
  intake:
    if: github.ref == 'refs/heads/main'
    name: Read sanitized intake metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Confirm requested main revision
        env:
          CONFIRM_SHA: ${{ inputs.confirm_main_sha }}
        run: test "$CONFIRM_SHA" = "$GITHUB_SHA"
      - name: Configure verified SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null
      - name: Read bounded diagnostics without processing events
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND 'bash -s -- %q %q diagnostics' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          diagnostic_temp="$(mktemp -d "$RUNNER_TEMP/crm-intake-read.XXXXXX")"
          trap 'rm -rf -- "$diagnostic_temp"' EXIT
          diagnostic_exit=0
          ssh -i ~/.ssh/service2_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=2 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" \
            < .github/scripts/crm_intake_worker_remote.sh \
            >"$diagnostic_temp/stdout" 2>"$diagnostic_temp/stderr" || diagnostic_exit=$?
          if [[ "$diagnostic_exit" != 0 ]]; then
            echo CRM_INTAKE_DIAGNOSTICS_UNAVAILABLE
            exit 2
          fi
          python3 scripts/crm_intake_diagnostic_receipt.py "$diagnostic_temp/stdout" "$GITHUB_SHA"
