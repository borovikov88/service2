name: Check hosting connection (no deploy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hosting-connection-check.yml
      - .github/scripts/check_hosting_connection.py

permissions:
  contents: read

jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    name: Verify production access without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify SSH key, hosting layout and HTTPS response
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: python3 .github/scripts/check_hosting_connection.py
