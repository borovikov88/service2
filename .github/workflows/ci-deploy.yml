name: Test and deploy main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: service2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "1"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ADVISOR_MCP_TEST_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Django configuration and migration state
        run: |
          python manage.py check --settings=service_site.test_settings
          python manage.py makemigrations --check --dry-run --settings=service_site.test_settings
      - name: Run test suite
        run: python manage.py test --settings=service_site.test_settings --verbosity 1

  review-gate:
    name: Verify independent review of exact main commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require merged PR and current-head independent approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          pulls="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/commits/$COMMIT_SHA/pulls")"
          pr="$(jq -cer --arg sha "$COMMIT_SHA" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | if length == 1 then .[0] else error("exactly one merged PR required") end' \
            <<<"$pulls")"
          number="$(jq -er '.number' <<<"$pr")"
          author="$(jq -er '.user.login' <<<"$pr")"
          head_sha="$(jq -er '.head.sha' <<<"$pr")"
          gh api --paginate --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/pulls/$number/reviews?per_page=100" | \
            python .github/scripts/verify_deploy_review.py \
              --author "$author" --head-sha "$head_sha" || {
              echo "No independent APPROVED review for the merged PR current head" >&2
              exit 1
            }

  deploy:
    name: Deploy tested main to Passenger
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, review-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null
      - name: Deploy exact tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          printf -v REMOTE_COMMAND 'bash -s -- %q %q' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND" < update.sh
      - name: Verify deployed site health
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HEALTH_URL"
          python - "$DEPLOY_HEALTH_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = urlsplit(sys.argv[1])
          if value.scheme != "https" or not value.hostname or value.username or value.password or value.query or value.fragment:
              raise SystemExit("DEPLOY_HEALTH_URL must be HTTPS without userinfo, query, or fragment")
          PY
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_HEALTH_URL")"
          [[ "$status" =~ ^2[0-9][0-9]$ ]] || {
            echo "Health check returned HTTP $status, expected 2xx" >&2
            exit 1
          }
