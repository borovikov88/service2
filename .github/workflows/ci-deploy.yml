name: Test and deploy main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_main_sha:
        description: "Exact 40-character SHA of the current main commit to test and deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: service2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Identify isolated calculator changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service_deploy: ${{ steps.scope.outputs.service_deploy }}
      calculator_deploy: ${{ steps.scope.outputs.calculator_deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine deployment scope from the exact push diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/aqualine22_scope.py

  test:
    name: Django checks and tests
    needs: scope
    outputs:
      service_deploy: ${{ needs.scope.outputs.service_deploy }}
      calculator_deploy: ${{ needs.scope.outputs.calculator_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "1"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ADVISOR_MCP_TEST_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Capture checked-out tree
        id: test_tree
        run: python3 .github/scripts/reuse_pr_tests.py capture
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Check reuse policy regressions
        run: |
          python -m unittest discover -s .github/tests -p test_reuse_pr_tests.py -v
          python -m unittest discover -s .github/tests -p test_crm_pilot_db_backup.py -v
          python -m unittest discover -s .github/tests -p test_crm_approved_access.py -v
          python -m unittest discover -s .github/tests -p test_crm_lead_intake_ops.py -v
      - name: Verify equivalent successful PR tests
        id: reuse
        run: python .github/scripts/reuse_pr_tests.py
      - name: Validate deploy workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "$RUNNER_TEMP/service2-actionlint.XXXXXX")"
          trap 'rm -rf -- "$lint_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$lint_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/direct-pr-review.yml .github/workflows/ci-deploy.yml \
            .github/workflows/development-codex.yml .github/workflows/codex-plan-connection.yml \
            .github/workflows/production-health.yml .github/workflows/avito-readonly-audit.yml .github/workflows/call-recordings-sync.yml \
            .github/workflows/employee-identity-sync.yml .github/workflows/avito-status-monitor.yml \
            .github/workflows/avito-outbox-readonly.yml .github/workflows/management-finance-mysql.yml
      - name: Verify Avito monitor scheduling and deployment locks
        if: steps.reuse.outputs.verified != 'true'
        run: python -m unittest discover -s .github/tests -p 'test_avito*py' -v
      - name: Verify water calculator and publication boundaries
        if: steps.reuse.outputs.verified != 'true'
        run: |
          node --test tools/aqualine22-calculator/tests/engine.test.mjs
          node --test pool_service/tests/estimate_state.test.mjs pool_service/tests/estimate_parameters.test.mjs pool_service/tests/estimate_numbers.test.mjs
          node --test pool_service/tests/crm_live_operations.test.cjs pool_service/tests/crm_lead_operations.test.cjs
          python -m unittest discover -s .github/tests -p test_aqualine22_publication.py -v
      - name: Install dependencies
        if: steps.reuse.outputs.verified != 'true'
        run: python -m pip install -r requirements.txt
      - name: Validate Django configuration and migration state
        if: steps.reuse.outputs.verified != 'true'
        run: |
          python manage.py check --settings=service_site.test_settings
          python manage.py makemigrations --check --dry-run --settings=service_site.test_settings
      - name: Chromium commercial card acceptance
        if: steps.reuse.outputs.verified != 'true'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          browser_dir="$(mktemp -d "$RUNNER_TEMP/service2-crm-browser.XXXXXX")"
          trap 'rm -rf -- "$browser_dir"' EXIT
          npm install --prefix "$browser_dir" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1
          export NODE_PATH="$browser_dir/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$browser_dir/browsers"
          node "$browser_dir/node_modules/playwright/cli.js" install --with-deps chromium
          CRM_CARD_BROWSER_TEST=1 python manage.py test pool_service.tests.test_crm_commercial_card_browser --settings=service_site.test_settings --verbosity 1
      - name: Run test suite
        if: steps.reuse.outputs.verified != 'true'
        run: python manage.py test --settings=service_site.test_settings --verbosity 1

      - name: PR_TESTED_TREE_V1 ${{ steps.test_tree.outputs.tree }} ${{ steps.test_tree.outputs.commit }}
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: echo 'Full PR checks completed for the captured checkout.'

  deploy:
    name: Deploy tested main to Passenger
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.test.outputs.service_deploy == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Confirm exact current main for manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          CONFIRM_MAIN_SHA: ${{ inputs.confirm_main_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "Manual deployment recovery must be dispatched from main" >&2
            exit 1
          }
          [[ "$CONFIRM_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Manual deployment recovery requires an exact 40-character lowercase SHA" >&2
            exit 1
          }
          [[ "$CONFIRM_MAIN_SHA" == "$COMMIT_SHA" ]] || {
            echo "Confirmed SHA does not match the dispatched commit" >&2
            exit 1
          }
          api="https://api.github.com/repos/$REPOSITORY"
          current_main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GitHub API did not return a valid main SHA" >&2
            exit 1
          }
          [[ "$current_main_sha" == "$COMMIT_SHA" ]] || {
            echo "main changed after this workflow was dispatched" >&2
            exit 1
          }
      - name: Checkout exact tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null
      - name: Verify hosting compatibility without modifying checkout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          printf -v REMOTE_COMMAND 'bash -s -- %q %q preflight' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND" < update.sh
      - name: Deploy exact tested commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND 'bash -s -- %q %q deploy' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND" < update.sh
      - name: Verify deployed Avito status monitor runtime
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; exec /bin/bash scripts/run_avito_status_monitor.sh --status' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
      - name: Activate 1C Diagnostic MCP once
        id: activate_diag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; test -f .env; test ! -L .env; result="$(../venv/bin/python scripts/enable_onec_diagnostic_mcp.py --env-file .env --marker-file ../tmp/onec-diagnostic-mcp-activated)"; printf "%%s\n" "$result"; if [[ "$result" != "Diagnostic MCP activation already completed earlier; no changes made." ]]; then touch ../tmp/restart.txt; fi' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA"
          result="$(ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" | tail -n 1)"
          case "$result" in
            "Diagnostic MCP activation flag enabled."|"Diagnostic MCP activation flag already enabled.")
              echo "smoke_required=true" >> "$GITHUB_OUTPUT"
              ;;
            "Diagnostic MCP activation already completed earlier; no changes made.")
              echo "smoke_required=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected Diagnostic MCP activation result" >&2
              exit 1
              ;;
          esac
      - name: Verify deployed site health
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HEALTH_URL"
          python - "$DEPLOY_HEALTH_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = urlsplit(sys.argv[1])
          if value.scheme != "https" or not value.hostname or value.username or value.password or value.query or value.fragment:
              raise SystemExit("DEPLOY_HEALTH_URL must be HTTPS without userinfo, query, or fragment")
          PY
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_HEALTH_URL")"
          [[ "$status" =~ ^2[0-9][0-9]$ ]] || {
            echo "Health check returned HTTP $status, expected 2xx" >&2
            exit 1
          }
      - name: Configure scoped Avito outgoing replies without sending the queue
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; exec env SERVICE2_AVITO_OUTBOX_SETUP=1 ../venv/bin/python scripts/avito_outbox_cron.py setup --app-dir %q --expected-sha %q' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA" "$DEPLOY_APP_PATH" "$GITHUB_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
      - name: Reconcile and finish only the explicitly authorised original Avito reply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[avito-outbox-original-20261025]')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          recovery_temp="$(mktemp -d "$RUNNER_TEMP/avito-outbox-recovery.XXXXXX")"
          trap 'rm -rf -- "$recovery_temp"' EXIT
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND 'bash -s -- %q %q' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          recovery_exit=0
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" \
            < .github/scripts/avito_outbox_recovery_remote.sh \
            >"$recovery_temp/stdout" 2>"$recovery_temp/stderr" || recovery_exit=$?
          python3 scripts/avito_outbox_recovery_receipt.py "$recovery_temp/stdout"
          [[ "$recovery_exit" == 0 ]] || {
            echo "AVITO_OUTBOX_ORIGINAL_RECOVERY_BLOCKED"; exit 2;
          }
      - name: Set up authorised Avito services connection once
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; exec 9>../tmp/service2-deploy.lock; flock -s -n 9; test "$(git rev-parse HEAD)" = %q; SERVICE2_AVITO_DEPLOY_SETUP=1 timeout 120 ../venv/bin/python manage.py configure_avito_services_workplace --expected-sha %q --base-url https://service2.aqualine22.ru' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
      - name: Run explicitly approved services draft photo check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[avito-services-release-v15-20261024]')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          operation_temp="$(mktemp -d "$RUNNER_TEMP/avito-services-release.XXXXXX")"
          trap 'rm -rf -- "$operation_temp"' EXIT
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND 'bash -s -- %q %q' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          operation_exit=0
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" \
            < .github/scripts/avito_services_release_remote.sh \
            >"$operation_temp/stdout" 2>"$operation_temp/stderr" || operation_exit=$?
          python3 scripts/avito_services_release_receipt.py "$operation_temp/stdout"
          [[ "$operation_exit" == 0 ]] || {
            echo "AVITO_SERVICES_RELEASE_TRANSPORT_BLOCKED"; exit 2;
          }
      - name: Publish only the owner's approved Services draft18 photo10
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[avito-services-approved-photo18-20261025]')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          approved_temp="$(mktemp -d "$RUNNER_TEMP/avito-approved-photo.XXXXXX")"
          trap 'rm -rf -- "$approved_temp"' EXIT
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND 'bash -s -- %q %q' "$GITHUB_SHA" "$DEPLOY_APP_PATH"
          approved_exit=0
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" \
            < .github/scripts/avito_services_approved_photo_remote.sh \
            >"$approved_temp/stdout" 2>"$approved_temp/stderr" || approved_exit=$?
          python3 scripts/avito_services_approved_photo_receipt.py "$approved_temp/stdout"
          [[ "$approved_exit" == 0 ]] || {
            echo "AVITO_SERVICES_APPROVED_PHOTO_TRANSPORT_BLOCKED"; exit 2;
          }
      - name: Verify Diagnostic MCP metadata is live after activation
        if: steps.activate_diag.outputs.smoke_required == 'true'
        env:
          EXPECTED_RESOURCE_URL: https://service2.aqualine22.ru/mcp/1c
          EXPECTED_ISSUER_URL: https://service2.aqualine22.ru/onec-diagnostic
          METADATA_URL: https://service2.aqualine22.ru/.well-known/oauth-protected-resource/mcp/1c
        run: |
          set -Eeuo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            "$METADATA_URL")"
          python - "$response" "$EXPECTED_RESOURCE_URL" "$EXPECTED_ISSUER_URL" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          expected_resource = sys.argv[2]
          expected_issuer = sys.argv[3]
          if data.get("resource") != expected_resource:
              raise SystemExit("Diagnostic resource URL does not match production MCP endpoint")
          if data.get("authorization_servers") != [expected_issuer]:
              raise SystemExit("Diagnostic authorization server does not match production issuer")
          scopes = data.get("scopes_supported") or []
          if "onec.diagnostic.read" not in scopes:
              raise SystemExit("Diagnostic scope is missing from protected-resource metadata")
          print("Diagnostic MCP metadata is live and bound to the expected resource/issuer.")
          PY
      - name: Finalize Diagnostic MCP activation marker
        if: success() && steps.activate_diag.outputs.smoke_required == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; ../venv/bin/python scripts/enable_onec_diagnostic_mcp.py --marker-file ../tmp/onec-diagnostic-mcp-activated --finalize-marker' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"

      - name: Read explicitly requested Avito links and last upload report
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[avito-audit]')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          audit_temp="$(mktemp -d "$RUNNER_TEMP/avito-audit.XXXXXX")"
          chmod 700 "$audit_temp"
          trap 'rm -rf -- "$audit_temp"' EXIT
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test ! -L ../tmp/service2-deploy.lock; exec 9>../tmp/service2-deploy.lock; flock -n 9; test "$(git rev-parse HEAD)" = %q; git diff --quiet HEAD -- pool_service service_site manage.py scripts; exec timeout 360 ../venv/bin/python manage.py audit_avito_readonly --connection-id 4 --account-id 446312402 --revision 15' \
            "$DEPLOY_APP_PATH" "$GITHUB_SHA"
          audit_exit=0
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND" \
            >"$audit_temp/stdout" 2>"$audit_temp/stderr" || audit_exit=$?
          python scripts/avito_readonly_receipt.py "$audit_temp/stdout"
          if [[ "$audit_exit" != 0 ]]; then
            echo "AVITO_READONLY_AUDIT_UNAVAILABLE transport_or_command_failed (deployment health checked separately)"
          fi


