  calculator:
    name: Publish calculator to the verified informational website
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.test.outputs.calculator_deploy == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: aqualine22-water-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          current="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          [[ "$current" == "$COMMIT_SHA" ]] || { echo 'main changed; no hosting files modified' >&2; exit 1; }
      - name: Verify the live website directory and publish calculator files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: python3 .github/scripts/aqualine22_calculator_host.py
