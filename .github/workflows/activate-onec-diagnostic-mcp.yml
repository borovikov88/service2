name: Activate 1C Diagnostic MCP

on:
  push:
    branches: [main]
    paths:
      - scripts/enable_onec_diagnostic_mcp.py
      - pool_service/tests/test_onec_diagnostic_activation.py
      - .github/workflows/activate-onec-diagnostic-mcp.yml

permissions:
  contents: read

concurrency:
  group: service2-onec-diagnostic-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Enable reviewed Diagnostic MCP in production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact reviewed main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Wait for normal reviewed deploy to reach this exact SHA
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          for attempt in $(seq 1 60); do
            printf -v REMOTE_COMMAND 'cd %q && git rev-parse HEAD' "$DEPLOY_APP_PATH"
            remote_sha="$(ssh -i ~/.ssh/service2_deploy \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND")"
            if [[ "$remote_sha" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Reviewed deploy did not reach expected SHA in time" >&2
          exit 1

      - name: Enable flag on exact deployed checkout and restart Passenger
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; test -f .env; test ! -L .env; ../venv/bin/python scripts/enable_onec_diagnostic_mcp.py --env-file .env; touch ../tmp/restart.txt' \
            "$DEPLOY_APP_PATH" "$EXPECTED_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"

      - name: Verify Diagnostic MCP protected-resource metadata
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -Eeuo pipefail
          base="$(python - "$DEPLOY_HEALTH_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = urlsplit(sys.argv[1])
          if value.scheme != "https" or not value.hostname or value.username or value.password:
              raise SystemExit("DEPLOY_HEALTH_URL must be an HTTPS URL")
          port = f":{value.port}" if value.port else ""
          print(f"https://{value.hostname}{port}")
          PY
          )"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            "$base/.well-known/oauth-protected-resource/mcp/1c")"
          python - "$response" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          scopes = data.get("scopes_supported") or []
          if "onec.diagnostic.read" not in scopes:
              raise SystemExit("Diagnostic scope is missing from protected-resource metadata")
          resource = data.get("resource")
          if not isinstance(resource, str) or not resource.startswith("https://"):
              raise SystemExit("Diagnostic resource URL is invalid")
          print("Diagnostic MCP metadata is live.")
          PY
