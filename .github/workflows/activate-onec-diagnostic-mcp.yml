name: Activate 1C Diagnostic MCP

on:
  workflow_run:
    workflows: ["Test and deploy main"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: service2-onec-diagnostic-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Enable reviewed Diagnostic MCP in production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Enable flag on exact deployed checkout and restart Passenger
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; test "$(git rev-parse HEAD)" = %q; test -f .env; test ! -L .env; ../venv/bin/python scripts/enable_onec_diagnostic_mcp.py --env-file .env; touch ../tmp/restart.txt' \
            "$DEPLOY_APP_PATH" "$EXPECTED_SHA"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"

      - name: Verify Diagnostic MCP protected-resource metadata
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          set -Eeuo pipefail
          base="$(python - "$DEPLOY_HEALTH_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          value = urlsplit(sys.argv[1])
          if value.scheme != "https" or not value.hostname or value.username or value.password:
              raise SystemExit("DEPLOY_HEALTH_URL must be an HTTPS URL")
          port = f":{value.port}" if value.port else ""
          print(f"https://{value.hostname}{port}")
          PY
          )"
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            "$base/.well-known/oauth-protected-resource/mcp/1c")"
          python - "$response" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          if data.get("resource") != data.get("resource", "").rstrip("/"):
              raise SystemExit("Diagnostic resource URL is not canonical")
          scopes = data.get("scopes_supported") or []
          if "onec.diagnostic.read" not in scopes:
              raise SystemExit("Diagnostic scope is missing from protected-resource metadata")
          print("Diagnostic MCP metadata is live.")
          PY
