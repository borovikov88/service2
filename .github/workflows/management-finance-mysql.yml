      - "pool_service/management/commands/configure_avito_services_workplace.py"
      - "pool_service/communication_api.py"
      - "pool_service/communication_services.py"
      - "pool_service/reward_models.py"
      - "pool_service/reward_views.py"
      - "pool_service/services/rewards.py"
      - "pool_service/migrations/**"
      - "pool_service/migrations/0117_reward_order_links.py"
      - "pool_service/migrations/0118_rewards_retail_check_rate.py"
      - "pool_service/migrations/0119_reward_customer_manager_rule.py"
      - "pool_service/tests/test_employee_rewards.py"
      - "pool_service/identity_normalization.py"
      - "pool_service/communication_megafon.py"
      - "pool_service/finance_imports/**"
      - "pool_service/services/employee_identity_sync.py"
      - "pool_service/migrations/0093_management_finance_foundation.py"
      - "pool_service/migrations/0094_mysql_identity_unique_constraints.py"
      - "pool_service/migrations/0097_onecodatasyncrun.py"
      - "pool_service/tests/test_management_finance_foundation.py"
      - "pool_service/tests/test_management_finance_migrations.py"
      - "pool_service/tests_communications.py"
      - "pool_service/tests/test_onec_odata_unified_sync.py"
      - "pool_service/tests/test_onec_daily_sync.py"
      - "pool_service/tests/test_onec_all_payroll_sync.py"
      - "pool_service/tests/test_onec_refresh_and_apply.py"
      - "pool_service/tests/test_odata_payroll_drafts.py"
      - "pool_service/management/commands/sync_onec_finance.py"
      - ".github/workflows/management-finance-mysql.yml"
      - ".github/workflows/ci-deploy.yml"
      - ".github/scripts/crm_pilot_db_backup_remote.sh"
      - ".github/tests/test_crm_pilot_db_backup.py"
      - "scripts/crm_pilot_db_backup.py"
      - "scripts/crm_pilot_db_backup_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: service2_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SECRET_KEY: mysql-ci-only-secret
      DEBUG: "1"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: service2_test
      DB_USER: root
      DB_PASSWORD: test-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify restricted native CRM backup and disposable restore
        timeout-minutes: 6
        env:
          SERVICE2_CRM_BACKUP_MYSQL_INTEGRATION: "1"
        run: |
          command -v mysqldump >/dev/null || command -v mariadb-dump >/dev/null
          command -v mysql >/dev/null || command -v mariadb >/dev/null
          python -m unittest discover -s .github/tests -p test_crm_pilot_db_backup.py -k NativeMySQLTests -v

      - name: Verify MySQL model and migration state
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan

      - name: Verify Avito date precision and read-only tools on MySQL
        run: |
          python manage.py test \
            pool_service.tests.test_avito_placement_continuity \
            pool_service.tests.test_avito_mcp \
            --verbosity 2

      - name: Run management finance tests on MySQL
        run: |
          python manage.py test \
            pool_service.tests.test_management_finance_foundation \
            pool_service.tests.test_management_finance_migrations \
            pool_service.tests.test_onec_odata_unified_sync \
            pool_service.tests.test_onec_daily_sync \
            pool_service.tests.test_onec_all_payroll_sync \
            pool_service.tests.test_onec_refresh_and_apply \
            pool_service.tests.test_odata_payroll_drafts \
            pool_service.tests_communications.CommunicationsTests.test_owner_can_create_and_edit_megafon_line_with_safe_recording_hosts \
            pool_service.tests_communications.CommunicationsTests.test_megafon_account_sync_auto_matches_employee_and_backfills_calls \
            pool_service.tests_communications.CommunicationsTests.test_megafon_accounts_repairs_legacy_api_endpoint_without_redirect \
            pool_service.tests.test_avito_daily_statistics \
            pool_service.tests.test_avito_period_statistics \
            pool_service.tests.test_avito_decision_report \
            pool_service.tests.test_avito_improvement_proposals \
            pool_service.tests.test_avito_experiment_baseline \
            pool_service.tests.test_avito_owner_review \
            pool_service.tests.test_avito_tariff_subscription \
            pool_service.tests.test_avito_crm_coverage \
            pool_service.tests.test_avito_crm_attribution \
            pool_service.tests.test_crm_source_orders \
            pool_service.tests.test_client_merge \
            pool_service.tests.test_conversation_clients \
            pool_service.tests.test_contact_identity \
            pool_service.tests.test_contact_identity_migrations \
            pool_service.tests.test_crm_inbox \
            pool_service.tests.test_crm_inbox_migrations \
            pool_service.tests.test_crm_commercial_foundation \
            pool_service.tests.test_crm_commercial_commands \
            pool_service.tests.test_crm_commercial_card \
            pool_service.tests.test_crm_object_needs \
            pool_service.tests.test_crm_object_need_corrections \
            pool_service.tests.test_crm_object_need_concurrency \
            pool_service.tests.test_contacts_roles \
            pool_service.tests.test_contacts_preservation_contract \
            pool_service.tests.test_contacts_migration \
            pool_service.tests.test_contacts_concurrency \
            pool_service.tests.test_crm_need_deals \
            pool_service.tests.test_crm_need_deal_concurrency \
            pool_service.tests.test_crm_need_deal_migrations \
            pool_service.tests.test_crm_object_need_migrations \
            pool_service.tests.test_crm_commercial_card_migrations \
            pool_service.tests.test_crm_commercial_migrations \
            pool_service.tests.test_crm_live_pilot_commands \
            pool_service.tests.test_crm_live_pilot_migrations \
            pool_service.tests.test_crm_live_views \
            pool_service.tests.test_crm_approved_access \
            pool_service.tests.test_crm_lead_commands \
            pool_service.tests.test_crm_lead_migrations \
            pool_service.tests.test_crm_lead_intake \
            pool_service.tests.test_crm_lead_views \
            pool_service.tests.test_crm_lead_activation \
            pool_service.tests.test_crm_org_scope \
            pool_service.tests.test_task_read_privacy \
            pool_service.tests.test_avito_promotion_observations \
            pool_service.tests.test_avito_workspace \
            pool_service.tests.test_avito_outbox \
            pool_service.tests.test_avito_outbox_display \
