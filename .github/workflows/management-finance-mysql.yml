name: Management finance MySQL compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-shard:
    name: MySQL shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: service2_test
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SECRET_KEY: mysql-ci-only-secret
      DEBUG: "1"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: service2_test
      DB_USER: root
      DB_PASSWORD: test-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify restricted native CRM backup and disposable restore
        if: matrix.shard == 0
        timeout-minutes: 6
        env:
          SERVICE2_CRM_BACKUP_MYSQL_INTEGRATION: "1"
        run: |
          command -v mysqldump >/dev/null || command -v mariadb-dump >/dev/null
          command -v mysql >/dev/null || command -v mariadb >/dev/null
          python -m unittest discover -s .github/tests -p test_crm_pilot_db_backup.py -k NativeMySQLTests -v
      - name: Verify MySQL model and migration state
        if: matrix.shard == 0
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
      - name: Run MySQL compatibility shard
        env:
          CI_SHARD: ${{ matrix.shard }}
        run: python .github/scripts/ci_test_runner.py mysql --settings=service_site.settings --shard "$CI_SHARD" --shards 4

  mysql-foundation:
    if: ${{ always() }}
    needs: mysql-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every MySQL shard
        env:
          SHARDS_RESULT: ${{ needs.mysql-shard.result }}
        run: test "$SHARDS_RESULT" = success
