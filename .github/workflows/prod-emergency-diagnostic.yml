name: Production emergency diagnostic

on:
  push:
    branches: ["qa/prod-emergency-diagnostic"]

permissions:
  contents: read

jobs:
  diagnostic:
    name: Read-only production emergency diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_emergency
          chmod 600 ~/.ssh/service2_emergency
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          PORT="${DEPLOY_PORT:-22}"
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect production HEAD and recent server errors
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/service2_emergency \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_APP_PATH'" <<'SH'
          set -Eeuo pipefail
          app_path="$1"
          cd "$app_path"
          printf 'PROD_HEAD %s\n' "$(git rev-parse HEAD)"
          printf 'PROD_STATUS_BEGIN\n'
          git status --short || true
          printf 'PROD_STATUS_END\n'
          printf 'PROD_LOG_SCAN_BEGIN\n'
          roots=("$(dirname "$app_path")" "$HOME")
          seen=""
          for root in "${roots[@]}"; do
            while IFS= read -r file; do
              case "$seen" in *"|$file|"*) continue;; esac
              seen="$seen|$file|"
              printf 'LOG_FILE %s\n' "$file"
              tail -n 1200 "$file" 2>/dev/null \
                | grep -E -B 8 -A 35 'Traceback \(most recent call last\)|Internal Server Error|ERROR|CRITICAL|Exception' \
                | tail -n 250 || true
            done < <(
              find "$root" -maxdepth 5 -type f \
                \( -name '*.log' -o -name 'error_log' -o -name 'stderr.log' -o -name 'passenger*.log' -o -name '*error*.log' \) \
                -mtime -3 -size +0c 2>/dev/null | sort
            )
          done
          printf 'PROD_LOG_SCAN_END\n'
          SH

      - name: Reproduce main GET pages inside production Django
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/service2_emergency \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_APP_PATH' && ../venv/bin/python manage.py shell" <<'PY'
          import traceback
          from django.contrib.auth import get_user_model
          from django.contrib.messages.storage.fallback import FallbackStorage
          from django.test import RequestFactory
          from django.urls import resolve, reverse
          from pool_service.models import OrganizationAccess, Pool

          User = get_user_model()
          access = (
              OrganizationAccess.objects.filter(
                  role__in=["owner", "admin"],
                  user__is_active=True,
              )
              .select_related("organization", "user")
              .order_by("organization_id", "id")
              .first()
          )
          if access is None:
              raise SystemExit("No active owner/admin access found")

          user_id = access.user_id
          organization_id = access.organization_id
          pool = Pool.objects.filter(
              organization_id=organization_id,
              is_deleted=False,
          ).order_by("id").first()

          routes = [
              ("pools", reverse("pool_list")),
              ("clients", reverse("clients_list")),
              ("users", reverse("users")),
              ("crm-index", reverse("crm_index")),
              ("crm-service", reverse("crm_list", kwargs={"direction": "service"})),
              ("crm-tasks", reverse("crm_tasks")),
              ("calendar", reverse("readings_all")),
              ("notifications", reverse("notifications")),
              ("finance-overview", reverse("finance_overview")),
              ("finance-kkm", reverse("finance_kkm_cash_dashboard")),
              ("finance-data", reverse("finance_data")),
              ("finance-report", reverse("finance_report")),
          ]
          if pool is not None:
              routes.insert(1, ("pool-detail", reverse("pool_detail", kwargs={"pool_uuid": pool.uuid})))

          factory = RequestFactory()
          print(f"DIAG_USER {user_id} ORG {organization_id}")
          for label, path in routes:
              try:
                  user = User.objects.select_related("profile").get(pk=user_id)
                  request = factory.get(path, HTTP_HOST="service2.aqualine22.ru")
                  request.user = user
                  request.session = {}
                  request._messages = FallbackStorage(request)
                  match = resolve(path)
                  request.resolver_match = match
                  response = match.func(request, *match.args, **match.kwargs)
                  if hasattr(response, "render"):
                      response.render()
                  print(
                      "DIAG_OK",
                      label,
                      path,
                      getattr(response, "status_code", None),
                      len(getattr(response, "content", b"")),
                  )
              except Exception as exc:
                  print("DIAG_FAIL", label, path, type(exc).__name__, str(exc))
                  traceback.print_exc()
          PY
