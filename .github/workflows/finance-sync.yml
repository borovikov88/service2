name: Wake finance sync worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service2-finance-sync-worker
  cancel-in-progress: false

jobs:
  wake-worker:
    name: Wake production finance worker
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Run bounded finance worker tick
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          printf -v REMOTE_COMMAND \
            'cd %q && ../venv/bin/python -B manage.py sync_onec_finance --max-steps 4 --max-seconds 240' \
            "$DEPLOY_APP_PATH"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND"
