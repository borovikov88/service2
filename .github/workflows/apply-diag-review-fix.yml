name: Apply staged Diagnostic MCP review fixes

on:
  push:
    branches: [feat/onec-diagnostic-mcp]
    paths: [.github/workflows/apply-diag-review-fix.yml]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "1"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/onec-diagnostic-mcp
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - run: git apply --check docs/ai/diag-review-fix.patch && git apply docs/ai/diag-review-fix.patch
      - run: python -m pip install -r requirements.txt
      - run: |
          python manage.py check --settings=service_site.test_settings
          python manage.py makemigrations --check --dry-run --settings=service_site.test_settings
          python manage.py test pool_service.tests.test_onec_diagnostic_mcp pool_service.tests.test_finance_mcp --settings=service_site.test_settings --verbosity 1
          git diff --check
      - run: |
          git rm docs/ai/diag-review-fix.patch .github/workflows/apply-diag-review-fix.yml
          git config user.name service2-ci
          git config user.email service2-ci@users.noreply.github.com
          git add pool_service/finance_mcp_auth.py pool_service/onec_diagnostic_mcp_views.py
          git commit -m "Fix remaining Diagnostic MCP review findings"
          git push origin HEAD:feat/onec-diagnostic-mcp
