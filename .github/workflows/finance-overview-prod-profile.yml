name: Finance Overview production profile

on:
  push:
    branches:
      - qa/finance-overview-prod-profile-20260920

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_profile
          chmod 600 ~/.ssh/service2_profile
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Profile current deployed Finance Overview read-only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
          EXPECTED_PROD_SHA: "ea62a40da730b8d7783a8043e97aff94554d6639"
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/service2_profile \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_APP_PATH' '$EXPECTED_PROD_SHA'" <<'REMOTE'
          set -euo pipefail
          app_path="$1"
          expected_sha="$2"
          cd "$app_path"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          echo "PROFILE_PROD_HEAD $actual_sha"
          ../venv/bin/python manage.py shell <<'PY'
          import json
          import time
          from collections import Counter
          from datetime import date

          from django.contrib.auth import get_user_model
          from django.contrib.messages.storage.fallback import FallbackStorage
          from django.db import connection
          from django.test import RequestFactory
          from django.test.utils import CaptureQueriesContext
          from django.urls import resolve, reverse

          from pool_service.models import OrganizationAccess
          from pool_service.finance_imports.owner_dashboard import (
              _comparison_specs,
              _range_data,
              _seasonality,
              _source_state,
              finance_overview_data,
              resolve_owner_period,
          )
          from pool_service.finance_imports.profit_dashboard import monthly_gross_profit_series
          from pool_service.finance_imports.payroll_accrual_dashboard import accrual_dashboard_data
          from pool_service.finance_imports.management_finance import cashflow_operating_monthly_summary

          TABLE_MARKERS = (
              "pool_service_onecreportperiodstate",
              "pool_service_onecmonthlyprofit",
              "pool_service_payrollaccrualmonth",
              "pool_service_payrollrow",
              "pool_service_cashflowrow",
              "pool_service_cashflowarticlemapping",
              "pool_service_onecimportbatch",
          )

          def query_summary(captured):
              result = Counter()
              for item in captured.captured_queries:
                  sql = (item.get("sql") or "").lower()
                  for marker in TABLE_MARKERS:
                      if marker in sql:
                          result[marker] += 1
              return dict(result)

          def profile(label, func):
              started = time.perf_counter()
              with CaptureQueriesContext(connection) as captured:
                  result = func()
                  if hasattr(result, "render"):
                      result.render()
              elapsed_ms = (time.perf_counter() - started) * 1000
              sql_ms = sum(
                  float(item.get("time") or 0) * 1000
                  for item in captured.captured_queries
              )
              print("FINANCE_PROFILE", json.dumps({
                  "stage": label,
                  "elapsed_ms": round(elapsed_ms, 1),
                  "queries": len(captured),
                  "sql_ms": round(sql_ms, 1),
                  "table_hits": query_summary(captured),
              }, sort_keys=True))
              return result

          access = (
              OrganizationAccess.objects.filter(
                  role__in=["owner", "admin"],
                  user__is_active=True,
              )
              .select_related("organization", "user")
              .order_by("organization_id", "id")
              .first()
          )
          if access is None:
              raise SystemExit("No owner/admin access")

          organization = access.organization
          params = {}
          today = date(2026, 9, 20)
          period = resolve_owner_period(params, today=today)

          profile(
              "current_range",
              lambda: _range_data(
                  organization,
                  period["first_month"],
                  period["last_month"],
              ),
          )
          for spec in _comparison_specs(period):
              profile(
                  "comparison_" + spec["key"],
                  lambda spec=spec: _range_data(
                      organization,
                      spec["first"],
                      spec["last"],
                      include_freshness=False,
                  ),
              )
          current_first = date(today.year, 1, 1)
          current_last = today.replace(day=1)
          previous_first = date(today.year - 1, 1, 1)
          previous_last = date(today.year - 1, today.month, 1)

          profile(
              "seasonality_profit_current",
              lambda: monthly_gross_profit_series(
                  organization, current_first, current_last
              ),
          )
          profile(
              "seasonality_profit_previous",
              lambda: monthly_gross_profit_series(
                  organization, previous_first, previous_last
              ),
          )
          profile(
              "seasonality_profit_state_current",
              lambda: _source_state(
                  organization,
                  "profit",
                  [
                      date(today.year, month, 1)
                      for month in range(1, today.month + 1)
                  ],
                  include_freshness=False,
              ),
          )
          profile(
              "seasonality_profit_state_previous",
              lambda: _source_state(
                  organization,
                  "profit",
                  [
                      date(today.year - 1, month, 1)
                      for month in range(1, today.month + 1)
                  ],
                  include_freshness=False,
              ),
          )
          profile(
              "seasonality_payroll_current",
              lambda: accrual_dashboard_data(
                  organization,
                  current_first,
                  current_last,
                  include_freshness=False,
              ),
          )
          profile(
              "seasonality_payroll_previous",
              lambda: accrual_dashboard_data(
                  organization,
                  previous_first,
                  previous_last,
                  include_freshness=False,
              ),
          )
          profile(
              "seasonality_cashflow_current",
              lambda: cashflow_operating_monthly_summary(
                  organization, current_first, current_last
              ),
          )
          profile(
              "seasonality_cashflow_previous",
              lambda: cashflow_operating_monthly_summary(
                  organization, previous_first, previous_last
              ),
          )
          profile("seasonality", lambda: _seasonality(organization, today))
          profile(
              "overview_data",
              lambda: finance_overview_data(
                  organization, params, today=today
              ),
          )

          User = get_user_model()
          user = User.objects.select_related("profile").get(pk=access.user_id)
          path = reverse("finance_overview")
          request = RequestFactory().get(
              path,
              HTTP_HOST="service2.aqualine22.ru",
          )
          request.user = user
          request.session = {}
          request._messages = FallbackStorage(request)
          match = resolve(path)
          request.resolver_match = match

          response = profile(
              "full_view",
              lambda: match.func(request, *match.args, **match.kwargs),
          )
          print("FINANCE_PROFILE_STATUS", response.status_code)
          print(
              "FINANCE_PROFILE_HTML_KB",
              round(len(response.content) / 1024, 1),
          )
          PY
          REMOTE
