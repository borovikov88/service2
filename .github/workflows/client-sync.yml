name: Sync recent 1C clients

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
    - cron: "31 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service2-client-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Import new 1C clients
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Synchronize 1C clients
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          SYNC_COMMAND="sync_recent_onec_clients --lookback-hours 168"
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "31 20 * * *" ]]; then
            SYNC_COMMAND="sync_full_onec_clients"
          fi
          printf -v REMOTE_COMMAND \
            'set -Eeuo pipefail; cd %q; exec 8>../tmp/service2-client-import.lock; if flock -n 8; then exec 9>../tmp/service2-deploy.lock; flock -s -w 120 9; ../venv/bin/python -B manage.py %s; else echo "Client import already running; automatic sync skipped."; fi' \
            "$DEPLOY_APP_PATH" "$SYNC_COMMAND"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_COMMAND"
