name: Sync call recordings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service2-call-recordings-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Save MegaFon recordings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Download recordings and process one requested analysis
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_PATH"
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          printf -v REMOTE_COMMAND             'set -Eeuo pipefail; cd %q; if [[ -f scripts/run_call_ai_worker.sh ]]; then /bin/bash scripts/run_call_ai_worker.sh 1 0 0; elif [[ -f pool_service/management/commands/process_requested_call_analyses.py ]]; then ( exec 8>../tmp/service2-call-ai.lock; if flock -n 8; then ../venv/bin/python manage.py process_requested_call_analyses --limit 1; else echo "Requested call analysis worker already running; skipping."; fi ); else echo "Requested call analysis worker is not deployed yet; skipping."; fi; if [[ -f pool_service/management/commands/sync_call_recordings.py ]]; then ( exec 9>../tmp/service2-deploy.lock; flock -s -w 600 9; ../venv/bin/python manage.py sync_call_recordings --limit 100 ); else echo "Recording sync command is not deployed yet; skipping."; fi'             "$DEPLOY_APP_PATH"
          ssh -i ~/.ssh/service2_deploy             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -p "$PORT"             "$DEPLOY_USER@$DEPLOY_HOST"             "$REMOTE_COMMAND"
      - name: Audit object to client links once
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          read -r -d '' PY_CODE <<'PY' || true
          import json
          from pool_service.models import Pool
          rows = []
          summary = {"active_objects": 0, "canonical_1c": 0, "legacy_unmerged": 0, "merged_source": 0}
          for pool in (
              Pool.objects.filter(is_deleted=False)
              .select_related("client", "client__crm_profile")
              .order_by("id")
          ):
              summary["active_objects"] += 1
              client = pool.client
              profile = getattr(client, "crm_profile", None)
              if profile and profile.merged_into_id:
                  status = "merged_source"
              elif profile and profile.onec_ref:
                  status = "canonical_1c"
              else:
                  status = "legacy_unmerged"
              summary[status] += 1
              haystack = " ".join(str(v or "") for v in (
                  pool.address, client.name, client.company_name,
                  client.first_name, client.last_name,
              )).casefold()
              if status != "canonical_1c" or "чертков" in haystack or "черткова" in haystack or "тест" in haystack:
                  rows.append({
                      "pool_id": pool.id,
                      "address": pool.address,
                      "client_id": client.id,
                      "client_name": client.name,
                      "client_type": client.client_type,
                      "status": status,
                      "onec_ref": profile.onec_ref if profile else None,
                      "merged_into_id": profile.merged_into_id if profile else None,
                      "is_chertkov_match": ("чертков" in haystack or "черткова" in haystack),
                      "is_test_match": ("тест" in haystack),
                  })
          print("OBJECT_CLIENT_AUDIT=" + json.dumps({"summary": summary, "rows": rows}, ensure_ascii=False))
          PY
          printf -v REMOTE_COMMAND 'cd %q; ../venv/bin/python manage.py shell -c %q' "$DEPLOY_APP_PATH" "$PY_CODE"
          ssh -i ~/.ssh/service2_deploy             -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"

