name: Temporary PR 122 reviewed diff delivery

on:
  push:
    branches:
      - feat/onec-diagnostic-sales-query
    paths:
      - .github/workflows/pr122-reviewed-diff-delivery.yml

permissions:
  contents: write
  issues: read

jobs:
  apply-reviewed-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout delivery commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 5

      - name: Validate exact delivery base
        shell: bash
        run: |
          set -euo pipefail
          base="4a0a3cb841f158cd1f89f86f717e60540223f636"
          workflow=".github/workflows/pr122-reviewed-diff-delivery.yml"
          test "${GITHUB_REF_NAME}" = "feat/onec-diagnostic-sales-query"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"

      - name: Fetch exact reviewed diff from PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          url = "https://api.github.com/repos/borovikov88/service2/issues/comments/5691490213"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "service2-pr122-reviewed-diff-delivery",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          body = payload.get("body", "")
          match = re.search(r"```diff\n(.*?)\n```", body, re.S)
          if not match:
              raise SystemExit("reviewed diff block missing")
          patch = match.group(1) + "\n"
          pairs = re.findall(r"^diff --git a/(.+?) b/(.+?)$", patch, re.M)
          paths = [left for left, right in pairs if left == right]
          expected = [
              "pool_service/onec_diagnostic.py",
              "pool_service/onec_diagnostic_mcp_views.py",
              "pool_service/tests/test_onec_diagnostic.py",
              "pool_service/tests/test_onec_diagnostic_mcp.py",
              "pool_service/tests/test_onec_diagnostic_mcp_chatgpt.py",
              "pool_service/tests/test_onec_diagnostic_sales.py",
          ]
          if paths != expected or len(pairs) != len(expected):
              raise SystemExit(f"unexpected reviewed diff paths: {pairs!r}")
          with open("/tmp/pr122-reviewed.patch", "w", encoding="utf-8", newline="\n") as handle:
              handle.write(patch)
          PY
          git apply --check /tmp/pr122-reviewed.patch

      - name: Apply reviewed diff and validate exact final tree
        shell: bash
        run: |
          set -euo pipefail
          base="4a0a3cb841f158cd1f89f86f717e60540223f636"
          git apply /tmp/pr122-reviewed.patch
          git rm -- .github/workflows/pr122-reviewed-diff-delivery.yml
          git add -A
          git diff --cached --check
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          cat > "$expected" <<'EOF'
          pool_service/onec_diagnostic.py
          pool_service/onec_diagnostic_mcp_views.py
          pool_service/tests/test_onec_diagnostic.py
          pool_service/tests/test_onec_diagnostic_mcp.py
          pool_service/tests/test_onec_diagnostic_mcp_chatgpt.py
          pool_service/tests/test_onec_diagnostic_sales.py
          EOF
          sort "$expected" -o "$expected"
          git diff --cached --name-only "$base" | sort > "$actual"
          diff -u "$expected" "$actual"

      - name: Commit and push exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "service2-reviewed-diff-delivery"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add safe 1C nomenclature sales query"
          git push origin "HEAD:refs/heads/feat/onec-diagnostic-sales-query"
