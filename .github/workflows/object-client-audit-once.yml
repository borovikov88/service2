name: One-time object client audit

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: service2-object-client-audit-once
  cancel-in-progress: true

jobs:
  audit:
    name: Audit object client links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/service2_deploy
          chmod 600 ~/.ssh/service2_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/service2_deploy >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          HOST_LOOKUP="$DEPLOY_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$DEPLOY_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Audit all active objects
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          read -r -d '' PY_CODE <<'PY' || true
          import json
          from pool_service.models import Pool
          rows = []
          summary = {"active_objects": 0, "canonical_1c": 0, "legacy_unmerged": 0, "merged_source": 0}
          for pool in (
              Pool.objects.filter(is_deleted=False)
              .select_related("client", "client__crm_profile")
              .order_by("id")
          ):
              summary["active_objects"] += 1
              client = pool.client
              profile = getattr(client, "crm_profile", None)
              if profile and profile.merged_into_id:
                  status = "merged_source"
              elif profile and profile.onec_ref:
                  status = "canonical_1c"
              else:
                  status = "legacy_unmerged"
              summary[status] += 1
              haystack = " ".join(str(v or "") for v in (
                  pool.address, client.name, client.company_name,
                  client.first_name, client.last_name,
              )).casefold()
              if status != "canonical_1c" or "чертков" in haystack or "черткова" in haystack or "тест" in haystack:
                  rows.append({
                      "pool_id": pool.id,
                      "address": pool.address,
                      "client_id": client.id,
                      "client_name": client.name,
                      "client_type": client.client_type,
                      "status": status,
                      "onec_ref": profile.onec_ref if profile else None,
                      "merged_into_id": profile.merged_into_id if profile else None,
                      "is_chertkov_match": ("чертков" in haystack or "черткова" in haystack),
                      "is_test_match": ("тест" in haystack),
                  })
          print("OBJECT_CLIENT_AUDIT=" + json.dumps({"summary": summary, "rows": rows}, ensure_ascii=False))
          PY
          printf -v REMOTE_COMMAND 'cd %q; ../venv/bin/python manage.py shell -c %q' "$DEPLOY_APP_PATH" "$PY_CODE"
          ssh -i ~/.ssh/service2_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_COMMAND"
