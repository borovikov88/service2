name: Apply Diagnostic MCP review fixes

on:
  push:
    branches: [feat/onec-diagnostic-mcp]
    paths: [.github/workflows/diag-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-secret
      DEBUG: "1"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      ADVISOR_MCP_TEST_ENABLED: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/onec-diagnostic-mcp
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply reviewed fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          finance = Path('pool_service/finance_mcp_auth.py')
          text = finance.read_text(encoding='utf-8')
          old = '''            FinanceMcpGrant.objects.filter(
                  client=client,
                  principal=client.principal,
                  revoked_at__isnull=True,
              ),'''
          new = '''            FinanceMcpGrant.objects.filter(
                  client=client,
                  principal=client.principal,
                  resource=authorization["resource"],
                  revoked_at__isnull=True,
              ),'''
          if old not in text:
              raise SystemExit('finance reauthorization anchor not found')
          finance.write_text(text.replace(old, new, 1), encoding='utf-8')

          views = Path('pool_service/onec_diagnostic_mcp_views.py')
          text = views.read_text(encoding='utf-8')
          old = '''def _audit(authenticated, *, name, arguments, result, started, response_bytes=0):
              """Persist metadata only; never filter values, rows, credentials or tokens."""
              elapsed = max(0, min(int((monotonic() - started) * 1000), 2_147_483_647))
              organization_id = getattr(settings, "ONEC_ODATA_TARGET_ORGANIZATION_ID", None)
              try:
                  organization_id = int(organization_id)
              except (TypeError, ValueError):
                  organization_id = None
              entity_set = ""
              if isinstance(arguments, dict) and isinstance(arguments.get("entity_set"), str):
                  entity_set = arguments["entity_set"][:300]
              selected_fields = json.dumps(_safe_field_names(arguments), ensure_ascii=False, separators=(",", ":"))
              values = [
                  authenticated.principal.pk if authenticated else None,
                  authenticated.grant.pk if authenticated else None,
                  authenticated.grant.authorized_by_id if authenticated else None,
                  organization_id,
                  (name if isinstance(name, str) else "invalid_tool")[:100],
                  entity_set,
                  selected_fields,
                  result[:16],
                  elapsed,
                  max(0, min(int(response_bytes), 2_147_483_647)),
              ]
              try:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          f"INSERT INTO {AUDIT_TABLE} "
                          "(principal_id, grant_id, authorized_by_id, target_organization_id, "
                          "tool_name, entity_set, selected_fields, result, duration_ms, response_bytes, created_at) "
                          "VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, CURRENT_TIMESTAMP)",
                          values,
                      )
              except Exception:
                  # Audit failure must not leak data or convert an authorization failure
                  # into a different response. Deployment smoke verifies the table exists.
                  pass
          '''
          new = '''def _audit(
              authenticated,
              *,
              name,
              arguments,
              result,
              started,
              response_bytes=0,
              required=False,
          ):
              """Persist metadata only; successful live reads require a durable audit event."""
              elapsed = max(0, min(int((monotonic() - started) * 1000), 2_147_483_647))
              organization_id = getattr(settings, "ONEC_ODATA_TARGET_ORGANIZATION_ID", None)
              try:
                  organization_id = int(organization_id)
              except (TypeError, ValueError):
                  organization_id = None

              # Request-derived labels are persisted only after a successful tool
              # execution. Denied/error requests may contain attacker-controlled
              # secrets disguised as entity/field names, so fail closed to blanks.
              entity_set = ""
              selected_fields = "[]"
              if result == "success" and isinstance(arguments, dict):
                  candidate = arguments.get("entity_set")
                  if isinstance(candidate, str):
                      entity_set = candidate[:300]
                  selected_fields = json.dumps(
                      _safe_field_names(arguments), ensure_ascii=False, separators=(",", ":")
                  )
              tool_name = name if isinstance(name, str) and name in TOOL_NAMES else "invalid_tool"
              values = [
                  authenticated.principal.pk if authenticated else None,
                  authenticated.grant.pk if authenticated else None,
                  authenticated.grant.authorized_by_id if authenticated else None,
                  organization_id,
                  tool_name,
                  entity_set,
                  selected_fields,
                  result[:16],
                  elapsed,
                  max(0, min(int(response_bytes), 2_147_483_647)),
              ]
              try:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          f"INSERT INTO {AUDIT_TABLE} "
                          "(principal_id, grant_id, authorized_by_id, target_organization_id, "
                          "tool_name, entity_set, selected_fields, result, duration_ms, response_bytes, created_at) "
                          "VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, CURRENT_TIMESTAMP)",
                          values,
                      )
              except Exception:
                  if required:
                      raise
          '''
          if old not in text:
              raise SystemExit('audit anchor not found')
          text = text.replace(old, new, 1)
          old_success = '''        _audit(
                  authenticated,
                  name=name,
                  arguments=arguments,
                  result="success",
                  started=started,
                  response_bytes=response_bytes,
              )'''
          new_success = '''        _audit(
                  authenticated,
                  name=name,
                  arguments=arguments,
                  result="success",
                  started=started,
                  response_bytes=response_bytes,
                  required=True,
              )'''
          if old_success not in text:
              raise SystemExit('success audit anchor not found')
          views.write_text(text.replace(old_success, new_success, 1), encoding='utf-8')

          tests = Path('pool_service/tests/test_onec_diagnostic_mcp.py')
          text = tests.read_text(encoding='utf-8')
          marker = '    def test_origin_and_transport_are_fail_closed(self):\n'
          if marker not in text:
              raise SystemExit('test insertion anchor not found')
          added = r'''    def test_denied_audit_drops_request_derived_labels(self):
              response = self._post_mcp({
                  "jsonrpc": "2.0",
                  "id": 50,
                  "method": "tools/call",
                  "params": {
                      "name": "read_1c_rows",
                      "arguments": {
                          "entity_set": "password=private-secret",
                          "fields": ["token=private-secret"],
                          "filters": [],
                          "url": "https://evil.example/private-secret",
                      },
                  },
              })
              self.assertTrue(response.json()["result"]["isError"])
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT tool_name, entity_set, selected_fields, result "
                      "FROM pool_service_onecdiagnosticmcpauditevent ORDER BY id DESC LIMIT 1"
                  )
                  row = cursor.fetchone()
              self.assertEqual(row[0], "read_1c_rows")
              self.assertEqual(row[1], "")
              self.assertEqual(json.loads(row[2]), [])
              self.assertEqual(row[3], "denied")
              self.assertNotIn("private-secret", " ".join(str(item) for item in row))

              response = self._post_mcp({
                  "jsonrpc": "2.0",
                  "id": 51,
                  "method": "tools/call",
                  "params": {"name": "password=private-secret", "arguments": {}},
              })
              self.assertIn("error", response.json())
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT tool_name, entity_set, selected_fields, result "
                      "FROM pool_service_onecdiagnosticmcpauditevent ORDER BY id DESC LIMIT 1"
                  )
                  row = cursor.fetchone()
              self.assertEqual(row[0], "invalid_tool")
              self.assertEqual(row[1], "")
              self.assertEqual(json.loads(row[2]), [])
              self.assertEqual(row[3], "denied")

          def test_successful_live_read_fails_closed_when_audit_insert_fails(self):
              config = ODataConfig(
                  base_url=MCP_SETTINGS["ONEC_ODATA_BASE_URL"],
                  username="reader",
                  password="secret",
                  organization_guids=(ORG_GUID,),
                  timeout_seconds=5,
                  max_pages=5,
                  max_rows=50,
              )
              live_data = {
                  "kind": "onec_diagnostic_rows",
                  "entity_set": "Document_Test",
                  "row_count": 1,
                  "rows": [{"Number": "must-not-leak"}],
              }
              with patch(
                  "pool_service.onec_diagnostic_mcp_views.onec_diagnostic.config_from_settings",
                  return_value=config,
              ), patch(
                  "pool_service.onec_diagnostic_mcp_views.onec_diagnostic.read_entity_rows",
                  return_value=live_data,
              ), patch(
                  "pool_service.onec_diagnostic_mcp_views.connection.cursor",
                  side_effect=RuntimeError("audit unavailable"),
              ):
                  response = self._post_mcp({
                      "jsonrpc": "2.0",
                      "id": 52,
                      "method": "tools/call",
                      "params": {
                          "name": "read_1c_rows",
                          "arguments": {
                              "entity_set": "Document_Test",
                              "fields": ["Number"],
                              "filters": [{"field": "Number", "op": "eq", "value": "1"}],
                          },
                      },
                  })
              result = response.json()["result"]
              self.assertTrue(result["isError"])
              self.assertNotIn("structuredContent", result)
              self.assertNotIn("must-not-leak", json.dumps(result, ensure_ascii=False))

          def test_finance_reauthorization_does_not_revoke_diagnostic_grant(self):
              from pool_service.finance_mcp_auth import issue_authorization_code as issue_finance_code

              diagnostic_grant = FinanceMcpGrant.objects.filter(
                  resource=DIAGNOSTIC_RESOURCE, revoked_at__isnull=True
              ).first()
              self.assertIsNotNone(diagnostic_grant)
              issue_finance_code(
                  authorization={
                      "client": self.oauth_client,
                      "redirect_uri": REDIRECT_URI,
                      "resource": FINANCE_RESOURCE,
                      "scopes": [FINANCE_READ_SCOPE],
                      "code_challenge": _pkce("f" * 64),
                  },
                  user=self.owner,
              )
              diagnostic_grant.refresh_from_db()
              self.assertIsNone(diagnostic_grant.revoked_at)

          '''
          tests.write_text(text.replace(marker, added + marker, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and test
        run: |
          set -euo pipefail
          python manage.py check --settings=service_site.test_settings
          python manage.py makemigrations --check --dry-run --settings=service_site.test_settings
          python manage.py test pool_service.tests.test_onec_diagnostic_mcp pool_service.tests.test_finance_mcp --settings=service_site.test_settings --verbosity 1
          git diff --check
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/diag-fix.yml
          git config user.name "service2-ci"
          git config user.email "service2-ci@users.noreply.github.com"
          git add pool_service/onec_diagnostic_mcp_views.py pool_service/finance_mcp_auth.py pool_service/tests/test_onec_diagnostic_mcp.py
          git commit -m "Fix remaining Diagnostic MCP review findings"
          git push origin HEAD:feat/onec-diagnostic-mcp
