name: Legacy API development retired

on:
  workflow_dispatch:
    inputs:
      task_reference:
        description: Development task reference
        required: true
        type: string
      launch_token:
        description: Non-secret idempotency token
        required: true
        type: string
      branch_name:
        description: Server-generated feature branch
        required: true
        type: string
      codex_model:
        description: Server-selected Codex model
        required: true
        type: string
      prompt_b64:
        description: UTF-8 task prompt encoded as base64
        required: true
        type: string
      pr_title_b64:
        description: UTF-8 pull request title encoded as base64
        required: true
        type: string

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain subscription-only development
        shell: bash
        run: |
          echo '::error::Separate API development is disabled. Use Codex signed in with ChatGPT and native Codex GitHub code review. See docs/ai/codex-direct-flow.md.'
          exit 1
